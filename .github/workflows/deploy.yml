name: Build & Deploy Frontend

# PR flow: the static bundle (static/webapp/, served by app.py and pulled by
# Amvera on merge to main) is committed INTO THE PR BRANCH by this workflow.
# It never pushes to main itself, so branch protection (PR + green CI, no
# force-push) can stay strict with zero bypass actors and zero extra secrets.
# Merge brings a fresh bundle to main -> Amvera webhook deploys it.
#
# Loop safety: the commit runs only when the bundle actually changed; after
# the commit the bundle is fresh, the diff is empty, the next run no-ops.
# The message intentionally has NO [skip ci] so required checks still run
# on the bundle commit (merge stays blocked until they pass).

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'web/src/**'
      - 'web/package.json'
      - 'web/package-lock.json'
      - 'web/next.config.mjs'
      - '.github/workflows/deploy.yml'
  # Manual rebuild from a FEATURE branch only: dispatching on main would try
  # to push to protected main and fail. Use it to refresh a stale PR bundle.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Build static export
        working-directory: ./web
        run: npm run build

      - name: Check if build output changed
        id: diff
        run: |
          if git diff --quiet -- static/webapp/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit fresh build to PR branch
        if: steps.diff.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: rebuild static webapp'
          file_pattern: static/webapp/
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
