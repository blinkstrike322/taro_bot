# Frontend verification: npm ci + typecheck + Next build (static export).
# Triggers independently of the backend (see ci-backend.yml). Read-only checks —
# never commits or deploys; the Deploy workflow (deploy.yml) owns shipping.
#
# NOTE on "lint": this repo has no ESLint configuration (no eslint.config.*, no
# eslint in devDependencies). Next's `next build` runs its own "Linting and
# checking validity of types" pass, and we additionally run `tsc --noEmit` as the
# explicit typecheck gate. There is no standalone ESLint step to run.
name: CI - Frontend

on:
  push:
    paths:
      - 'web/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/ci-frontend.yml'
  workflow_dispatch:

# Separate concurrency group so this never collides with the deploy group.
concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    name: frontend (typecheck · build)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Type-check (tsc)
        working-directory: ./web
        run: npx tsc --noEmit

      - name: Unit tests (vitest)
        working-directory: ./web
        run: npm test

      - name: Build static export
        working-directory: ./web
        run: npm run build